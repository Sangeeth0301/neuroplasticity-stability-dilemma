# Dual-Manifold ContextSync — base configuration.
# Every tunable number in the system lives here or in a config that overlays it.

seed: 7
run_tag: base

data:
  n_threads_train: 24
  n_threads_test: 6
  turns_per_thread: 600
  n_users: 5
  n_facts_per_thread: 60
  probe_distances: [10, 50, 200, 500]
  probes_per_fact: 1
  filler_ratio: 0.55
  distractor_ratio: 0.25
  supersede_ratio: 0.35        # raised: 0.20 gave only ~16 supersession probes (Phase 3)
  regimes: [single_owner, multi_owner, adversarial]
  su_target_tokens: 40

encode:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  embed_dim: 384
  proj_dim: 256
  whiten_components: 256
  whiten_eps: 0.1              # chosen from the V06b whitening study, not by default
  feature_dim: 1024            # must equal 2**quantum.n_qubits
  block_norm_targets: [0.35, 0.35, 0.20, 0.10]   # p_q | p_c | interaction | relational
  batch_size: 128

memory:
  candidate_M: 256
  consolidate_every: 50
  salience_alpha: 0.05
  ann_nlist: 64

quantum:
  n_qubits: 10
  depth: 8                     # >= n_qubits//2 (light-cone floor, Phase 5 finding)
  ansatz: brickwall
  gate_form: exp               # 'product' if you need the parameter-shift rule to be exact
  readout_qubit: 9
  observable: local_z
  beta_init: 4.0
  bias_init: 0.0
  init_scale: 0.05
  noise_p: 0.0

train:
  task_window_turns: 40
  epochs_per_task: 3
  batch_size: 32
  lr: 0.03
  lr_classical: 0.001
  replay_capacity: 8000
  replay_ratio: 0.5
  lambda_omega: 0.01
  trust_region_delta: 0.35
  drift_threshold: 0.25
  fim_probe_size: 256
  n_negatives: 8

assemble:
  token_budget: 3072
  reserve_system: 256
  reserve_pinned: 256
  reserve_recent: 768
  redundancy_lambda: 0.35
  value_prior:
    fact: 1.0
    summary: 0.7
    filler: 0.35
