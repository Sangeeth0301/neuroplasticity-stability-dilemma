[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcs"
version = "0.1.0"
description = "Dual-Manifold ContextSync — quantum-classical continual learning for long multi-user chat threads"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "matplotlib>=3.9",
    "pyyaml>=6",
    "networkx>=3.3",
    "tqdm>=4.66",
    "scikit-learn>=1.5",
    "pennylane>=0.40",
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
extra = ["tensorcircuit-ng>=1.9", "qiskit>=1.2", "umap-learn>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
